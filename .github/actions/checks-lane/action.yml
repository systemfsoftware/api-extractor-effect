name: api-extractor-effect checks lane
description: this repository's steps for each phase of systemfsoftware's reusable-checks.yml
inputs:
  lane:
    description: plan, lint, typecheck, build, test, test-after, timings or gate
    required: true
  job:
    description: The test job from the plan, as JSON
    required: false
    default: "{}"
  profile:
    description: Conformance profile; this repository has none, so it is ignored
    required: false
    default: per-change
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      if: inputs.lane == 'plan' || inputs.lane == 'timings' || inputs.lane == 'build' || inputs.lane == 'lint' || inputs.lane == 'typecheck' || inputs.lane == 'test'
      with:
        extra_nix_config: |
          extra-substituters = https://nix.systemfsoftware.com
          extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
    - name: The test-timings planner from the flake
      if: inputs.lane == 'plan' || inputs.lane == 'timings'
      shell: bash -e {0}
      run: echo "$(nix build --no-link --print-out-paths .#test-timings)/bin" >> "$GITHUB_PATH"
    - name: attw from the flake
      if: inputs.lane == 'build'
      shell: bash -e {0}
      run: echo "$(nix build --no-link --print-out-paths .#attw)/bin" >> "$GITHUB_PATH"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.lane == 'plan' || inputs.lane == 'lint' || inputs.lane == 'typecheck' || inputs.lane == 'build' || inputs.lane == 'test'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.lane == 'plan' || inputs.lane == 'lint' || inputs.lane == 'typecheck' || inputs.lane == 'build' || inputs.lane == 'test'
      with:
        node-version: 24
    - name: Install from the lockfile; the dev shell copies in the producer tarballs
      if: inputs.lane == 'lint' || inputs.lane == 'typecheck' || inputs.lane == 'build' || inputs.lane == 'test'
      shell: bash -e {0}
      run: nix develop --command pnpm install --frozen-lockfile
