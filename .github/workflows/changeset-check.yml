name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/changeset-check.yml@b255966726dc197ff6a7018a2667c384c7e4a22d
    with:
      # The lockfile installs `file:.deps` tarballs, which the dev shell copies in
      # from this repository's flake.
      devshell: true
