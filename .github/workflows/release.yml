# The release flow is pnpm-release-management's reusable workflow. This caller
# supplies the trigger, the permissions its jobs ask for, and the CI workflow it
# dispatches on the release PR branch. Distribution is a git tag, a GitHub
# Release and this repository's flake outputs; there is no npm publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@b9b4a1d48cc16241b33f9afd8ab99b82b05ce04f
    with:
      ci-workflow: ci.yml
  noop:
    name: no release off main, so the run concludes success, not skipped
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "Release writes only from refs/heads/main; $GITHUB_REF runs nothing."
