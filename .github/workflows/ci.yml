name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The reusable release workflow dispatches this file on the release PR branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, build with attw, and the test jobs the planner packs from
  # recorded timings. Each phase runs .github/actions/checks-lane.
  checks:
    permissions:
      contents: read
      actions: read
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-checks.yml@732f66a0c85819b2005f9e0930a595bc4de91ee1
    with:
      lanes: '[{"id": "lint", "name": "lint", "timeout-minutes": 10, "run": "pnpm lint"}, {"id": "typecheck", "name": "typecheck", "timeout-minutes": 10, "run": "pnpm typecheck"}, {"id": "build", "name": "build · attw", "timeout-minutes": 10, "run": "pnpm build && pnpm --filter @systemfsoftware/api-extractor attw"}]'
      timeout-minutes: 10
      max-seconds: 600
      plan-timeout-minutes: 10

  host-bytes:
    name: Output bytes on ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
      # The dev shell copies the producer tarballs into .deps/ before pnpm runs.
      - name: Install from the lockfile and the producer tarballs
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Serialise a fixed-seed sample of models and verdicts
        run: nix develop --command node --conditions=@systemfsoftware/source apps/api-extractor-e2e/host-digest.ts > host-output.bin
      - run: sha256sum host-output.bin && uname -m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-output-${{ matrix.arch }}
          path: host-output.bin

  host-compare:
    name: Same bytes on every host
    needs: host-bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: host-output-*
      - run: sha256sum host-output-*/host-output.bin
      - name: Compare x86_64 and arm64 outputs byte for byte
        run: cmp host-output-x86_64/host-output.bin host-output-arm64/host-output.bin
