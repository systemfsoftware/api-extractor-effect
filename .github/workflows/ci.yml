name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The reusable release workflow dispatches this file on the release PR branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs the affected lint, typecheck and build, then attw; a Mergify queue draft and main run the
  # whole workspace and its tests. One job, so the runner and Nix setup are paid once.
  checks:
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-ci.yml@7544b79a7f94d783ba7832bc7b07a413d5c60793
    with:
      commitlint: false
      changeset: true
      fast: export TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD" && pnpm exec turbo run typecheck lint --affected && PATH="$(nix build --no-link --print-out-paths .#attw)/bin:$PATH" pnpm --filter @systemfsoftware/api-extractor attw
      full: pnpm lint && pnpm typecheck && pnpm build && PATH="$(nix build --no-link --print-out-paths .#attw)/bin:$PATH" pnpm --filter @systemfsoftware/api-extractor attw && pnpm test

  host-bytes:
    name: Output bytes on ${{ matrix.arch }}
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://nix.systemfsoftware.com
            extra-trusted-public-keys = nix-cache-1:wXA8I4DayNW9q6enUyQA/P/nT38pGSTLt374t3gsn7M=
      # The dev shell copies the producer tarballs into .deps/ before pnpm runs.
      - name: Install from the lockfile and the producer tarballs
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Serialise a fixed-seed sample of models and verdicts
        run: nix develop --command node --conditions=@systemfsoftware/source apps/api-extractor-e2e/host-digest.ts > host-output.bin
      - run: sha256sum host-output.bin && uname -m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-output-${{ matrix.arch }}
          path: host-output.bin

  host-compare:
    name: Same bytes on every host
    if: github.event_name == 'push'
    needs: host-bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-output-*
      - run: sha256sum host-output-*/host-output.bin
      - name: Compare x86_64 and arm64 outputs byte for byte
        run: cmp host-output-x86_64/host-output.bin host-output-arm64/host-output.bin
