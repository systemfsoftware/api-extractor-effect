# Mergify: policy lives in systemfsoftware/.github (.mergify.yml). This file only names this repo's CI checks.
extends: .github
queue_rules:
    # Checked on the PR itself before it enters the queue.
  - name: subtree
    merge_method: merge
    queue_conditions:
      # Org convention (systemfsoftware/.github README, "Subtree PRs"): one commit
      # carries both trailers, and the PR history is not linear.
      - 'commits[*].commit_message ~= (?ms)\A(?=.*^git-subtree-dir: \S+$)(?=.*^git-subtree-split: [0-9a-f]{40}$)'
      - -linear-history
      - or:
          - check-success = review-gate
          - approved-reviews-by = kiro-systemf[bot]
          - and:
              - author = dependabot[bot]
              - dependabot-update-type != version-update:semver-major
              - or:
                  - dependabot-update-type = version-update:semver-patch
                  - dependabot-update-type = version-update:semver-minor
                  - "title ~= (?i)\\bthe [a-z0-9@/._-]*(minor|patch)[a-z0-9@/._-]* group\\b"
      - check-success = checks / check
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = checks / check

  - name: default
    # Checked on the PR itself before it enters the queue.
    queue_conditions:
      # Subtree PRs merge via the subtree queue above (org README, "Subtree PRs"): a pull request that names a
      # subtree in its title and touches a vendored prefix needs the trailers, or it matches no queue.
      - '-commits[*].commit_message ~= (?m)^git-subtree-dir: \S+$'
      - not:
          and:
            - 'title ~= (?i)(?<![\w.-])(add|pull|update|sync|vendor|vendored|vendoring|refresh|import|bump|upgrade)(?!\.?[\w-])'
            - 'title ~= (?i)(?<![\w.-])subtrees?(?!\.?[\w-])'
            - or:
                - "added-files ~= ^(vendor|vendored|third[_-]party|external|repos|subtrees?)/"
                - "modified-files ~= ^(vendor|vendored|third[_-]party|external|repos|subtrees?)/"
      # Hand edits inside this repository's vendored prefixes cannot merge without a subtree pull.
      - -added-files ~= ^(repos/alchemy|repos/effect)/
      - -modified-files ~= ^(repos/alchemy|repos/effect)/
      - or:
          - check-success = review-gate
          - approved-reviews-by = kiro-systemf[bot]
          - and:
              - author = dependabot[bot]
              - dependabot-update-type != version-update:semver-major
              - or:
                  - dependabot-update-type = version-update:semver-patch
                  - dependabot-update-type = version-update:semver-minor
                  - "title ~= (?i)\\bthe [a-z0-9@/._-]*(minor|patch)[a-z0-9@/._-]* group\\b"
      - check-success = checks / check
    # Checked on Mergify's queue draft PR (mergify/merge-queue/*), i.e. CI on the PR rebased with main and any batch.
    merge_conditions:
      - check-success = checks / check
