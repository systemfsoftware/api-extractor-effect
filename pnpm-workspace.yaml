packages:
  - apps/*
  - packages/*

allowBuilds:
  protobufjs: false

catalog:
  "@effect/platform-node": 4.1.2
  "@effect/tsgo": 0.64.1
  "@microsoft/api-extractor": 7.59.1
  "@microsoft/tsdoc": 0.16.0
  "@types/node": 24.19.1
  effect: 4.1.2
  oxlint: ~1.93.0
  oxlint-tsgolint: 7.0.2005
  oxc-parser: 0.150.0
  oxc-transform: 0.150.0
  tsdown: 0.23.0
  turbo: 2.10.12
  typescript: 7.0.2
  vite: 8.2.1
  vitest: 5.0.3

# Three days (minutes); the same in every systemfsoftware repo, so producer and consumer gates agree.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
  - "@systemfsoftware/*"

overrides:
  "@effect/tsgo": "catalog:"

versioning:
  changelog:
    storage: repository
